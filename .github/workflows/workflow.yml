name: CI & Publish

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
      - '[0-9]*' # Akzeptiert auch 1.1.4 ohne v
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[examples] pytest pytest-asyncio fastapi starlette uvicorn mcp pyyaml pydantic httpx
    - name: Run tests
      run: |
        python -m pytest tests/test_manager_v2.py

  build-n-publish:
    name: Build and publish to PyPI
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build
    - name: Build binary wheel and source tarball
      run: python -m build
    - name: Publish package to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

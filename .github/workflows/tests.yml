name: Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[examples] pytest pytest-asyncio fastapi starlette uvicorn mcp pyyaml pydantic httpx
    - name: Run tests
      run: |
        python -m pytest tests/test_manager_v2.py

version: '1.0'
servers:
  github:
    name: GitHub MCP Server
    description: Ermöglicht das Suchen von Repositories, Erstellen von Issues und
      Verwalten von PRs.
    transport: stdio
    command: npx
    args:
    - -y
    - '@modelcontextprotocol/server-github'
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: env:GITHUB_PAT
    instructions: Verwende diese Tools zur Interaktion mit GitHub. Schone Rate-Limits.
    remedies:
      search_repositories:
        on_error: Die GitHub-Suche war erfolglos. Prüfe, ob du Sonderzeichen im Query-Parameter
          verwendet hast, und vereinfache den Suchbegriff.

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "elemm"
version = "1.3.1"
authors = [
  { name="Marc Stöcker" },
]
description = "AI Landmarks: The specialized protocol for autonomous agent discovery."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Business Source License 1.1" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.24.0",
    "mcp>=0.1.0",
    "pyyaml",
    "starlette",
    "uvicorn",
    "fastapi",
    "websockets"
]

[project.urls]
"Homepage" = "https://github.com/v3rm1ll1on/elemm"
"Bug Tracker" = "https://github.com/v3rm1ll1on/elemm/issues"

[project.scripts]
elemm-gateway = "elemm_gateway.cli:main"
elemm-dashboard = "elemm_gateway.ui_backend.dashboard_server:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["examples*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "elemm"
version = "1.1.1"
description = "AI Landmarks: The specialized protocol for autonomous agent discovery."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx",
    "mcp>=0.1.0",
    "pyyaml",
    "starlette",
    "uvicorn"
]

[project.scripts]
elemm-gateway = "elemm_gateway.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

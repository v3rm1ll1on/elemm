version: "1.0.0"

landmarks:
  noc:
    type: "navigation"
    description: "Network Operations: Resolve IPs to Hostnames."
  it_ops:
    type: "navigation"
    description: "IT Operations: Search system and application logs."
  banking:
    type: "navigation"
    description: "Banking: Map transaction tokens to financial accounts."
  finance:
    type: "navigation"
    description: "Finance: Audit account ownership and employee links."
  hr:
    type: "navigation"
    description: "Human Resources: Resolve employee IDs to corporate identities."
  remediation:
    type: "navigation"
    description: "Remediation: Administrative actions and reporting."

  "noc:resolve_ip_to_host":
    type: "tool"
    description: "Resolve internal IP to hostname."
    remedy: "Verify the target IP format (e.g. 10.0.4.x)."
    returns: "{ hostname: string }"
    parameters:
      - {name: "ip", type: "string", description: "Target IP address", required: true}

  "it_ops:query_node_logs":
    type: "tool"
    description: "Retrieve logs for a specific node."
    remedy: "Verify your search filter (e.g. 'EXFIL') and ensure the hostname matches the one resolved via NOC."
    returns: "{ ts: string, action: string, evidence_token: string, username: string }[]"
    parameters:
      - {name: "hostname", type: "string", description: "Node identifier", required: true}
      - {name: "q", type: "string", description: "Search query or filter", required: false}

  "banking:link_token_to_account":
    type: "tool"
    description: "Map evidence tokens to financial accounts."
    remedy: "Use a valid Routing Token (RT-XXXX) found in the IT logs."
    returns: "{ account_id: string, token: string }"
    parameters:
      - {name: "token", type: "string", description: "Evidence or transaction token", required: true}

  "finance:audit_account_owner":
    type: "tool"
    description: "Identify employee ID linked to a financial account."
    remedy: "Use an Account ID (ACC-XXXX) previously resolved via the banking landmark."
    returns: "{ employee_id: string, account_id: string }"
    parameters:
      - {name: "account_id", type: "string", description: "Financial account ID", required: true}

  "hr:resolve_principal":
    type: "tool"
    description: "Map employee ID to corporate username."
    remedy: "Use an Employee ID (EMP-XXXX) resolved via the finance audit tool."
    returns: "{ username: string, employee_id: string }"
    parameters:
      - {name: "employee_id", type: "string", description: "Internal employee ID", required: true}

  "remediation:quarantine_principal":
    type: "action"
    description: "Place a corporate user under technical quarantine."
    remedy: "Ensure you have the Corporate Username (CORP-XX) and the corresponding RT-token."
    returns: "{ status: string }"
    parameters:
      - {name: "username", type: "string", description: "Corporate username", required: true}
      - {name: "token", type: "string", description: "Associated evidence token", required: true}

  "remediation:restart_node":
    type: "action"
    description: "Trigger remote reboot of a node."
    remedy: "Verify the SRV-XXXX hostname."
    returns: "{ status: string }"
    parameters:
      - {name: "hostname", type: "string", description: "Node hostname", required: true}

  "remediation:secure_escrow":
    type: "action"
    description: "Secure risk capital in forensic escrow."
    remedy: "Requires a valid account reference."
    returns: "{ status: string }"
    parameters:
      - {name: "account_ref", type: "string", description: "Account or asset reference", required: true}

  "remediation:submit_gauntlet_report":
    type: "action"
    description: "Submit final forensic audit report."
    remedy: "You must complete all remediation steps (Quarantine, Restart, Secure) before reporting."
    returns: "{ status: string }"
    parameters:
      - {name: "incident_id", type: "string", description: "Incident tracking ID", required: true}
      - {name: "summary", type: "string", description: "Detailed remediation summary", required: true}
